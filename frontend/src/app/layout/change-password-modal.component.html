@if (open) {
  <div class="modal-backdrop" role="presentation">
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="change-password-title">
      <div class="panel-title">
        <div>
          <h2 id="change-password-title">Change Password</h2>
          <p>Update the credentials for your signed-in account.</p>
        </div>
        <button class="button ghost small" type="button" (click)="close()">Close</button>
      </div>

      <form class="form-panel" [formGroup]="form" (ngSubmit)="submit()">
        <label class="field">
          <span>Current password</span>
          <input type="password" formControlName="currentPassword" autocomplete="current-password">
          @if (form.controls.currentPassword.touched && form.controls.currentPassword.invalid) {
            <small>Current password is required.</small>
          }
        </label>

        <label class="field">
          <span>New password</span>
          <input type="password" formControlName="newPassword" autocomplete="new-password">
          @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
            <small>Use at least 8 characters.</small>
          }
        </label>

        <label class="field">
          <span>Confirm new password</span>
          <input type="password" formControlName="confirmPassword" autocomplete="new-password">
          @if (form.controls.confirmPassword.touched && form.hasError('passwordMismatch')) {
            <small>Passwords do not match.</small>
          }
        </label>

        <button class="button primary wide" type="submit" [disabled]="submitting">
          {{ submitting ? 'Updating...' : 'Change Password' }}
        </button>
      </form>
    </section>
  </div>
}
